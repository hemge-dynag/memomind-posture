<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>GM Posture</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-header">
      <h1>Rappel de posture</h1>
      <span id="status" class="status">Démarrage…</span>
    </header>

    <main>
      <section class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="enable-toggle">
          <span>Activer le suivi</span>
        </label>
      </section>

      <section class="settings">
        <div class="setting">
          <label for="threshold">Angle de détection : <span id="threshold-value">15</span>°</label>
          <input type="range" id="threshold" min="5" max="45" step="1" value="15">
        </div>
        <div class="setting">
          <label for="duration">Durée avant rappel : <span id="duration-value">5</span> s</label>
          <input type="range" id="duration" min="2" max="30" step="1" value="5">
        </div>
      </section>

      <section class="calibrate">
        <button id="calibrate-button">Calibrer la posture</button>
        <p class="hint">Tiens-toi droit au moment de calibrer. Sur les lunettes, tu peux aussi appuyer sur le bouton.</p>
      </section>

      <section class="stats">
        <h2>Rappels</h2>
        <div class="stat-grid">
          <div class="stat">
            <span id="today-count" class="stat-value">0</span>
            <span class="stat-label">aujourd'hui</span>
          </div>
          <div class="stat">
            <span id="week-count" class="stat-value">0</span>
            <span class="stat-label">7 derniers jours</span>
          </div>
        </div>
        <p id="last-alert" class="hint">Aucun rappel pour le moment.</p>
      </section>
    </main>

    <script type="module" src="plugin.js"></script>
  </body>
</html>
